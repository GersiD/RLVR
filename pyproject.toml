[project]
name = "rlvr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gersi.doko", email = "Gersi.doko@unh.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[project.scripts]
rlvr = "rlvr:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
